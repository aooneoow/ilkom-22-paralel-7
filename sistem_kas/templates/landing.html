<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Kas Kelas</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            height: 100vh;
            width: 100%;
            background: linear-gradient(135deg, #6a5acd, #8360c3);
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            text-align: center;
            animation: fadeIn 1.2s ease-in-out;
        }

        .title {
            font-size: 45px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 18px;
            margin-bottom: 30px;
        }

        .btn-enter {
            background: white;
            color: #5a4edb;
            padding: 14px 35px;
            font-size: 17px;
            font-weight: 600;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-enter:hover {
            background: #e8e8e8;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* LOADING OVERLAY */
        #loadingOverlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
        }

        .loader {
            width: 60px;
            height: 60px;
            border: 6px solid rgba(255,255,255,0.4);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>

<div class="container">
    <div class="title">Sistem Kas Kelas</div>
    <div class="subtitle">Kelola keuangan kelas secara modern & efisien</div>

    <button class="btn-enter" onclick="startLoading()">Masuk ke Sistem</button>
</div>

<!-- LOADING -->
<div id="loadingOverlay">
    <div class="loader"></div>
</div>

<script>
    function startLoading() {
        document.getElementById("loadingOverlay").style.display = "flex";
        setTimeout(() => {
            window.location.href = "login.html";
        }, 1500);
    }
</script>

</body>
</html>
